name: CI

# `pull_request`, deliberately NOT `pull_request_target`.
#
# This repo is public and takes fork PRs. `pull_request` checks out the fork's
# code and runs it with a read-only GITHUB_TOKEN and no access to repository
# secrets. `pull_request_target` would run that same untrusted code with the
# base repo's write token and secrets in scope — which is how a token-stealing
# PR gets merged into a package thousands of apps install. Do not change it.
#
# There are no secrets in this repo to leak anyway (publishing is OIDC, see
# release.yml), and this workflow is what keeps it that way.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint + a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Stylelint + the text-level Tier 2 backstop. No browser needed.
      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The Tier 1 gate: contrast, target size, ARIA, focus order.
      - name: Accessibility
        run: npm run test:a11y

      # The declared contrast policy. Deterministic — no screenshots, no font
      # rendering — so unlike test:visual it is safe to run on any runner.
      - name: Contrast policy
        run: npm run test:contrast

      # Layout rules no other gate can see: header alignment, control leading.
      - name: Layout
        run: npm run test:layout

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Separate job, and pinned to the image the baselines were generated in.
    # Screenshot comparison is the one gate that is sensitive to font rendering,
    # so it cannot share the bare ubuntu-latest runner the job above uses —
    # same OS is not the same environment. Keep this tag in lockstep with
    # @playwright/test, release.yml and visual-baselines.yml.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Visual regression
        run: npm run test:visual

      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7
