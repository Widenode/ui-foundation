name: CI

# `pull_request`, deliberately NOT `pull_request_target`.
#
# This repo is public and takes fork PRs. `pull_request` checks out the fork's
# code and runs it with a read-only GITHUB_TOKEN and no access to repository
# secrets. `pull_request_target` would run that same untrusted code with the
# base repo's write token and secrets in scope — which is how a token-stealing
# PR gets merged into a package thousands of apps install. Do not change it.
#
# There are no secrets in this repo to leak anyway (publishing is OIDC, see
# release.yml), and this workflow is what keeps it that way.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # THE POINT OF THIS JOB: run exactly what `prepack` runs, in exactly the
    # image it runs in, so a green PR means the release will publish.
    #
    # It did not, for three consecutive attempts at v0.4.0. The branch used to
    # run lint/a11y/contrast/layout on a bare ubuntu-latest runner while
    # `npm publish` ran the full `verify` inside this container — different
    # command, different fonts. Two font-dependent assertions passed on the
    # branch and failed at tag time, and one of them was itself the fix for the
    # previous failure. Splitting the gates from what actually gates the release
    # is how you find out at the worst possible moment.
    #
    # Keep this tag in lockstep with @playwright/test in package.json,
    # release.yml, and visual-baselines.yml.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Browsers are baked into the image, so there is no `playwright install`
      # here and nothing to cache — which also retires the apt-get roulette that
      # used to cost this job anywhere from 21s to 681s.
      - name: Verify
        run: npm run verify

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
